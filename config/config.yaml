server:
  binding_host: "127.0.0.1"
  port: 9092
storage:
  artifact_root: "data/artifacts"
artifact:
  public_base_url: "http://127.0.0.1:9092"
  max_compressed_bytes: 268435456
  max_extracted_bytes: 1073741824
  max_single_file_bytes: 536870912
  max_entries: 32
model_provision:
  provider_namespace: "local-mtlf"
  seed_models:
    - family_id: "ue-communication-default"
      model_id: 1
      artifact_key: "5b11c450bc11d0d41474ad5a720d473e59ba2e9c41f2a321b83384e12593db7f"
      event: "UE_COMMUNICATION"
      event_filter: {}
notification:
  request_timeout_seconds: 5
  max_attempts: 3
  initial_backoff_seconds: 0.2
  max_backoff_seconds: 2
model_monitor:
  callback_uri: "http://127.0.0.1:9092/internal/v1/ml-model-monitor/notifications"
  report_period_seconds: 90
  request_timeout_seconds: 30
  retry_interval_seconds: 1
  retry_max_interval_seconds: 30
accuracy_policy:
  enabled: true
  reference_buffer_size: 12
  min_reference_samples: 5
  min_std: 0.14
  fixed_floor: 0.05
  z_score_threshold: 1.3
  decision_window_size: 5
  required_hits: 3
  scope_state_ttl_seconds: 600
adrf:
  mode: "nrf"
  configured_endpoint: ""
  discovery_timeout_seconds: 30
  request_timeout_seconds: 120
  retry_initial_backoff_seconds: 2
  retry_max_backoff_seconds: 30
dataset:
  retrieval_window_seconds: 1800
  watchdog_timeout_seconds: 120
  fetch_timeout_seconds: 120
  max_redirects: 3
  max_retry_attempts: 3
  retry_initial_backoff_seconds: 1
  retry_max_backoff_seconds: 30
  max_concurrent_jobs: 2
  max_records_per_job: 100000
  mongodb:
    url: "mongodb://127.0.0.1:27017"
    database: "free5gc"
    collection: "nwdaf_raw_notifications"
    connect_timeout_ms: 5000
    read_timeout_ms: 30000
training:
  enabled: true
  device: "cpu"
  batch_size: 32
  learning_rate: 0.001
  epochs: 18
  validation_ratio: 0.20
  random_seed: 42
  max_concurrent_jobs: 1
  max_queue_size: 16
  enforce_performance_gate: true
  max_scope_wape_regression: 0.02
log:
  level: "INFO"
