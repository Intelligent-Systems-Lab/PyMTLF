# FL Server-capable PyMTLF profile with Root-side static topology initiation.
# This enables creation of hierarchy plans; it does not register a permanent Root role.
server:
  binding_host: "127.0.0.1"
  port: 9092

runtime:
  mode: "federated"

containing_nwdaf:
  internal_api_root: "http://127.0.0.1:8091"
  request_timeout_seconds: 30

storage:
  artifact_root: "data/artifacts"
model_state:
  directory: "data/model-state"
publication:
  directory: "data/publications"

artifact:
  public_base_url: "http://127.0.0.1:9092"

federated_learning:
  workspace_root: "data/fl-workspaces"
  workspace_ttl_seconds: 3600
  public_base_url: "http://127.0.0.1:9092"
  request_timeout_seconds: 300
  artifact_download:
    allowed_origins:
      - "http://127.0.0.1:9093"
      - "http://127.0.0.1:9094"
    timeout_seconds: 300
  server:
    callback_uri: "http://127.0.0.1:9092/internal/v1/ml-model-training/notifications"
    preparation_timeout_seconds: 300
    preparation_data_window_seconds: 3600
    round_timeout_seconds: 300
    round_count: 2
    max_active_processes: 1
  strategy:
    algorithm:
      name: "fedprox"
      proximal_mu: 0.01
    participant_selection: "all"
    waiting_policy: "all"
    aggregation: "sample_weighted"
  topology:
    strategy: "static"
    config_file: "./topology/hierarchical-topology.yaml"
  training_trigger:
    private_api:
      enabled: false

model_provision:
  seed_models:
    - family_id: "ue-communication-default"
      model_id: 1
      artifact_key: "5b11c450bc11d0d41474ad5a720d473e59ba2e9c41f2a321b83384e12593db7f"
      event: "UE_COMMUNICATION"
      event_filter: {}
      target_ue: null
      model_interoperability: "001122"
      use_case_context: ""

model_monitor:
  callback_uri: "http://127.0.0.1:9092/internal/v1/ml-model-monitor/notifications"

accuracy_policy:
  enabled: true

adrf:
  mode: "nrf"

log:
  level: "INFO"
