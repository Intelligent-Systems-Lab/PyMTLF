[project]
name = "py_mtlf"
version = "0.1.0"
description = "Internal MTLF backend for NWDAF training workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pymongo>=4.11.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_mtlf"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["seed_models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
